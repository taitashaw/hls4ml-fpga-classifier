<svg viewBox="0 0 1180 760" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Mono, Menlo, monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2c3e50"/>
    </marker>
  </defs>
  <rect width="1180" height="760" fill="#f7f7f5"/>
  <text x="20" y="30" font-size="18" font-weight="700" fill="#1a1a1a">hls4ml_system block design: real, validated topology (Vivado 2025.2, xczu7ev-ffvc1156-2-e)</text>
  <text x="20" y="50" font-size="12" fill="#555">Diagram of the real .bd file's cells and connections (validate_bd_design: 0 critical warnings). Not a GUI screenshot, see README for why.</text>

  <!-- Zynq PS -->
  <rect x="40" y="100" width="220" height="420" rx="6" fill="#dcebe0" stroke="#2c7a72" stroke-width="2"/>
  <text x="150" y="125" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a1a">zynq_ultra_ps_e_0</text>
  <text x="150" y="141" font-size="10" text-anchor="middle" fill="#555">Zynq UltraScale+ PS, v3.5</text>
  <text x="150" y="156" font-size="10" text-anchor="middle" fill="#555">board_part zcu104:part0:1.1</text>
  <rect x="220" y="180" width="10" height="16" fill="#2c7a72"/>
  <text x="205" y="192" font-size="10" text-anchor="end" fill="#1a1a1a">M_AXI_HPM0_FPD</text>
  <rect x="220" y="330" width="10" height="16" fill="#2c7a72"/>
  <text x="205" y="342" font-size="10" text-anchor="end" fill="#1a1a1a">S_AXI_HP0_FPD</text>
  <rect x="220" y="400" width="10" height="16" fill="#2c7a72"/>
  <text x="205" y="412" font-size="10" text-anchor="end" fill="#1a1a1a">S_AXI_HP1_FPD</text>
  <rect x="220" y="470" width="10" height="16" fill="#2c7a72"/>
  <text x="205" y="482" font-size="10" text-anchor="end" fill="#1a1a1a">pl_ps_irq0[1:0]</text>

  <!-- AXI-Lite control interconnect (simplified: real design also has ps8_0_axi_periph + auto_ds + auto_pc + rst_ps8_0_100M) -->
  <rect x="320" y="165" width="200" height="50" rx="4" fill="#fdf3e3" stroke="#b5602a" stroke-width="1.5"/>
  <text x="420" y="185" font-size="11" text-anchor="middle" fill="#1a1a1a">AXI-Lite control path</text>
  <text x="420" y="199" font-size="9" text-anchor="middle" fill="#555">ps8_0_axi_periph + auto_ds/auto_pc</text>
  <line x1="230" y1="188" x2="320" y2="190" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- AXI DMA -->
  <rect x="320" y="260" width="220" height="220" rx="6" fill="#e3ecf7" stroke="#2c5f8a" stroke-width="2"/>
  <text x="430" y="282" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a1a">axi_dma_0</text>
  <text x="430" y="298" font-size="10" text-anchor="middle" fill="#555">AXI DMA v7.1, no scatter-gather</text>
  <text x="335" y="320" font-size="9" fill="#1a1a1a">S_AXI_LITE (ctrl)</text>
  <line x1="420" y1="215" x2="420" y2="260" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="335" y="345" font-size="9" fill="#1a1a1a">M_AXIS_MM2S, 32b</text>
  <text x="335" y="400" font-size="9" fill="#1a1a1a">S_AXIS_S2MM, 16B (128b)</text>
  <rect x="530" y="355" width="10" height="14" fill="#2c5f8a"/>
  <text x="430" y="435" font-size="9" text-anchor="middle" fill="#1a1a1a">M_AXI_MM2S</text>
  <rect x="530" y="428" width="10" height="14" fill="#2c5f8a"/>
  <text x="430" y="460" font-size="9" text-anchor="middle" fill="#1a1a1a">M_AXI_S2MM</text>
  <rect x="530" y="452" width="10" height="14" fill="#2c5f8a"/>
  <text x="335" y="285" font-size="8" fill="#1a1a1a"></text>
  <text x="430" y="248" font-size="9" text-anchor="middle" fill="#1a1a1a">mm2s_introut, s2mm_introut →</text>

  <!-- SmartConnects -->
  <rect x="230" y="325" width="70" height="20" rx="3" fill="#eee" stroke="#888"/>
  <text x="265" y="339" font-size="9" text-anchor="middle" fill="#333">axi_smc</text>
  <rect x="230" y="395" width="70" height="20" rx="3" fill="#eee" stroke="#888"/>
  <text x="265" y="409" font-size="9" text-anchor="middle" fill="#333">axi_smc_1</text>
  <line x1="325" y1="435" x2="300" y2="335" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="325" y1="459" x2="300" y2="405" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="230" y1="335" x2="230" y2="335" stroke="none"/>
  <line x1="230" y1="335" x2="230" y2="335" stroke="none"/>
  <line x1="230" y1="188" x2="230" y2="188" stroke="none"/>
  <line x1="230" y1="335" x2="220" y2="335" stroke="none"/>

  <!-- myproject HLS core -->
  <rect x="650" y="260" width="230" height="220" rx="6" fill="#f7e3ea" stroke="#a3395f" stroke-width="2"/>
  <text x="765" y="282" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a1a">myproject_0</text>
  <text x="765" y="298" font-size="10" text-anchor="middle" fill="#555">exported hls4ml IP, xilinx.com:hls:myproject:1.0</text>
  <text x="765" y="313" font-size="9" text-anchor="middle" fill="#555">latency 20 cyc, II 7 cyc, ap_ctrl_hs + 2x AXIS</text>
  <rect x="645" y="335" width="10" height="16" fill="#a3395f"/>
  <text x="663" y="347" font-size="9" fill="#1a1a1a">input_1, 256b (16 × ap_fixed&lt;16,6&gt;)</text>
  <rect x="875" y="400" width="10" height="16" fill="#a3395f"/>
  <text x="867" y="412" font-size="9" text-anchor="end" fill="#1a1a1a">layer9_out, 80b (5 × ap_fixed&lt;16,6&gt;)</text>
  <text x="765" y="440" font-size="9" text-anchor="middle" fill="#1a1a1a">ap_clk, ap_rst_n, ap_start(tied 1),</text>
  <text x="765" y="453" font-size="9" text-anchor="middle" fill="#1a1a1a">ap_done / ap_ready / ap_idle (unconnected)</text>

  <line x1="540" y1="362" x2="645" y2="343" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ap_start tie -->
  <rect x="650" y="500" width="120" height="40" rx="4" fill="#eee" stroke="#888"/>
  <text x="710" y="524" font-size="10" text-anchor="middle" fill="#333">ap_start_tie = 1'b1</text>
  <line x1="710" y1="500" x2="710" y2="480" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- width converter -->
  <rect x="920" y="370" width="220" height="80" rx="6" fill="#fdf3e3" stroke="#b5602a" stroke-width="2"/>
  <text x="1030" y="392" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a1a">layer9_out_dwidth</text>
  <text x="1030" y="408" font-size="9" text-anchor="middle" fill="#555">axis_dwidth_converter v1.1</text>
  <text x="1030" y="422" font-size="9" text-anchor="middle" fill="#555">S: 10B (80b) → M: 16B (128b), TLAST on</text>
  <line x1="885" y1="408" x2="920" y2="408" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- back to DMA S2MM: route down and left -->
  <path d="M 920 440 L 900 440 L 900 600 L 550 600 L 550 462 L 540 462" fill="none" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- irq concat -->
  <rect x="320" y="560" width="140" height="50" rx="4" fill="#eee" stroke="#888"/>
  <text x="390" y="581" font-size="10" text-anchor="middle" fill="#333">irq_concat</text>
  <text x="390" y="595" font-size="9" text-anchor="middle" fill="#555">xlconcat, 2 → pl_ps_irq0</text>
  <line x1="390" y1="480" x2="390" y2="560" stroke="#999" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="230" y1="478" x2="320" y2="580" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="40" y="660" font-size="10" fill="#333">Data path (AXI4-Stream): DMA M_AXIS_MM2S → myproject/input_1 → myproject/layer9_out → dwidth converter → DMA S_AXIS_S2MM</text>
  <text x="40" y="678" font-size="10" fill="#333">Memory path: DMA ↔ PS via two independent SmartConnects (HP0 for MM2S, HP1 for S2MM), avoiding the orphaned-SmartConnect</text>
  <text x="40" y="694" font-size="10" fill="#333">bug hit when both DMA masters were first routed through one shared HP0 (validate_bd_design: "axi_smc_1 missing a valid master").</text>
  <text x="40" y="718" font-size="10" fill="#333">Clock: single ap_clk domain, PS pl_clk0. myproject_0/ap_clk auto-wired by apply_bd_automation (clkrst rule), confirmed connected</text>
  <text x="40" y="734" font-size="10" fill="#333">by validate_bd_design returning 0 errors.</text>
</svg>
